<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Доска объявлений</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg bg-white border-bottom">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">Объявления</a>
        <button class="btn btn-dark" onclick="document.getElementById('addForm').scrollIntoView({behavior:'smooth'})">
            Добавить
        </button>
    </div>
</nav>

<main class="container py-5">

    <section class="hero mb-5">
        <div>
            <span class="badge text-bg-dark mb-3">ONLINE</span>
            <h1>Найди нужную вещь<br>или размести свою</h1>
            <p>Простая доска объявлений для покупки и продажи товаров.</p>
        </div>
    </section>

    <section class="mb-5" id="addForm">
        <div class="form-box">
            <h2 class="mb-4">Новое объявление</h2>

            <form id="adForm">
                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label">Название</label>
                        <input type="text" class="form-control" id="title" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Цена</label>
                        <input type="number" class="form-control" id="price" min="0" step="0.01" required>
                    </div>

                    <div class="col-12">
                        <label class="form-label">Описание</label>
                        <textarea class="form-control" id="description" rows="4" required></textarea>
                    </div>

                    <div class="col-md-8">
                        <label class="form-label">Изображение</label>
                        <input type="file" class="form-control" id="image" accept="image/*" required>
                    </div>

                    <div class="col-md-4 d-flex align-items-end">
                        <button type="submit" class="btn btn-dark w-100">
                            Опубликовать
                        </button>
                    </div>

                </div>
            </form>

            <div id="message" class="mt-3"></div>
        </div>
    </section>

    <section>
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="mb-1">Все объявления</h2>
                <span id="total" class="text-secondary"></span>
            </div>

            <button class="btn btn-outline-dark" onclick="loadAds()">
                Обновить
            </button>
        </div>

        <div id="adsList" class="row g-4"></div>
    </section>

</main>

<script src="script.js"></script>
</body>
</html>
